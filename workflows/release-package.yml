name: Release & Publish Container Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write       # Para criar tags, releases e commits de changelog
  pull-requests: write  # Para abrir e atualizar o Release PR
  packages: write       # Para publicar imagens no GHCR

jobs:
  # 1. Analisa Conventional Commits, mantém o Release PR e gera a Tag Git
  release-please:
    name: 🤖 Google Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: 🚀 Executar Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: node

  # 2. Só compila e publica no GHCR quando o Release PR é mesclado e a tag oficial é criada
  publish-container:
    name: 🐳 Build & Publish Multi-Arch Image
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Código na Tag Criada
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: 🔧 Configurar Emulação QEMU (para suporte ARM64)
        uses: docker/setup-qemu-action@v3

      - name: 🛠️ Configurar Docker Buildx (Construtor Multi-Plataforma)
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extrair Metadados e Tags SemVer
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.release-please.outputs.tag_name }}

      - name: 🚀 Build e Push da Imagem Multi-Arch (x86_64 e ARM64)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
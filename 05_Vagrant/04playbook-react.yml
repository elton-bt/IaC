- name: Instalando pacotes
  hosts: servidoresweb
  tasks:
    - name: Instalando apenas nos servidores web que forem Ubuntu
      become: true
      ansible.builtin.apt:
        name: '{{ item }}'
        state: present
        update_cache: true
      loop:
        - mc
        - nginx
        - nodejs
        - npm
      when: ansible_distribution == "Ubuntu"

- name: 'Clone, build e install da app react'
  hosts: ubuntu
  tasks:
    - name: Clona repositorio com exemplo
      become: true
      ansible.builtin.git:
        repo: 'https://github.com/elton-bt/react-example-app.git'
        dest: /home/vagrant/react-example-app
        clone: true
        update: true
        version: 016d6d9

    - name: Instala as dependencias usando npm
      become: true
      community.general.npm:
        path: /home/vagrant/react-example-app
        state: present

    - name: Faz o build do projeto
      become: true
      ansible.builtin.command: npm run build
      args:
        chdir: /home/vagrant/react-example-app
      register: output
      changed_when: output.rc != 0

    - name: Faz a copia do build para o diretorio do nginx
      become: true
      ansible.builtin.copy:
        src: /home/vagrant/react-example-app/build/
        dest: /var/www/html/
        remote_src: true
        mode: preserve

    - name: Configura o Nginx para redirecionar rotas SPA para o index.html
      become: true
      ansible.builtin.replace:
        path: /etc/nginx/sites-available/default
        regexp: 'try_files \$uri \$uri/ =404;'
        replace: 'try_files $uri $uri/ /index.html;'

- name: Reiniciando serviços
  hosts: ubuntu
  tasks:
    - name: Recarrega nginx para aplicar configuracao
      become: true
      ansible.builtin.service:
        name: nginx
        state: reloaded
        enabled: true
